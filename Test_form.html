<!DOCTYPE html>
<html>
<head>
<title>Alberta Geo Test Logger</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input, select, textarea, button {

    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-size: 16px;
    box-sizing: border-box;

}

textarea {
    height: 120px;
}

button {

    background: #222;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 20px;

}

.secondary {

    background: #666;

}

#testIdDisplay {

    margin-top:20px;
    padding:10px;
    background:#eee;
    border-radius:5px;
    display:none;

}

</style>

</head>


<body>


<div class="container">


<h2>Alberta Geo Test Logger</h2>


<label>Tester</label>
<select id="tester">
<option>Nick</option>
<option>Josh</option>
</select>


<label>Test Suite</label>
<select id="suite">

<option>Registration</option>
<option>Login</option>
<option>Geolocation</option>
<option>Deposit</option>
<option>Withdrawal</option>
<option>Game Launch</option>
<option>Responsible Gambling</option>
<option>Other</option>

</select>


<label>Scenario</label>

<input 
id="scenario"
placeholder="Example: Login after switching WiFi to LTE">


<label>Result</label>

<select id="result">

<option>PASS</option>
<option>FAIL</option>
<option>BLOCKED</option>

</select>



<label>Device</label>

<input 
id="device"
placeholder="Example: iPhone 17 Pro">



<label>Operating System</label>

<input
id="os"
placeholder="Example: iOS 27">



<label>Carrier / Network</label>

<select id="carrier">

<option>Telus</option>
<option>Rogers</option>
<option>Bell</option>
<option>WiFi</option>
<option>Other</option>

</select>



<label>Build Version</label>

<input
id="build"
placeholder="Example: 4.2.0">



<label>Notes</label>

<textarea
id="notes"
placeholder="Describe what happened"></textarea>



<div id="testIdDisplay"></div>



<button onclick="generateTest()">

Generate Test Email

</button>


<button 
class="secondary"
onclick="copyLastTest()">

Copy Last JSON

</button>


</div>





<script>


let lastJSON = "";

let currentLocation = {

    latitude:null,
    longitude:null,
    accuracy:null

};



// Request GPS when page loads

if (navigator.geolocation) {


navigator.geolocation.getCurrentPosition(

function(position){


currentLocation.latitude =
position.coords.latitude;


currentLocation.longitude =
position.coords.longitude;


currentLocation.accuracy =
position.coords.accuracy;


},


function(error){

console.log(
"GPS unavailable",
error
);

},

{
enableHighAccuracy:true,
timeout:10000
}


);


}




async function generateTest(){



let now = new Date();



let testId =

"AB-" +

now.toISOString()

.replace(/[-:TZ.]/g,"")

.substring(0,14);



let data = {


testId:testId,


timestamp:
now.toISOString(),


tester:
document.getElementById("tester").value,


suite:
document.getElementById("suite").value,


scenario:
document.getElementById("scenario").value,


result:
document.getElementById("result").value,


device:
document.getElementById("device").value,


os:
document.getElementById("os").value,


carrier:
document.getElementById("carrier").value,


build:
document.getElementById("build").value,


location:{

latitude:
currentLocation.latitude,

longitude:
currentLocation.longitude,

accuracy:
currentLocation.accuracy

},


notes:
document.getElementById("notes").value


};



lastJSON =
JSON.stringify(data,null,2);



document.getElementById("testIdDisplay").style.display="block";


document.getElementById("testIdDisplay").innerHTML =

"<b>Test ID:</b><br>" + testId +

"<br><br>Use this ID for screenshots/videos.";



let subject =

"[GEO][" +

data.result +

"][" +

data.suite +

"] " +

testId;



// Mobile share menu

if (navigator.share){


try {


await navigator.share({

title:subject,

text:lastJSON

});


return;


}

catch(error){

console.log(
"Share cancelled"
);

}


}



// Clipboard fallback


try {


await navigator.clipboard.writeText(lastJSON);


alert(

"JSON copied to clipboard.\n\n" +

"Create your email and paste it."

);


}

catch(error){


alert(lastJSON);


}



}





async function copyLastTest(){


if (!lastJSON){

alert(
"No test generated yet."
);

return;

}


try {


await navigator.clipboard.writeText(lastJSON);


alert(
"JSON copied."
);


}

catch(error){

alert(lastJSON);

}


}



</script>


</body>

</html>
