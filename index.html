<!DOCTYPE html>
<html>

<head>

<title>Alberta Market Test Logger</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {

    font-family: Arial, sans-serif;
    background:#062f1c;
    color:white;
    padding:20px;

}

.container {

    max-width:600px;
    margin:auto;
    background:#0b472c;
    padding:25px;
    border-radius:12px;

}

h2 {

    text-align:center;
    color:#7dffb3;

}

label {

    font-weight:bold;
    display:block;
    margin-top:15px;

}

input, select, textarea, button {

    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:none;
    font-size:16px;

}


textarea {

    height:140px;

}


button {

    margin-top:25px;
    background:#19a463;
    color:white;
    font-weight:bold;
    cursor:pointer;

}


button:hover {

    background:#22c77a;

}


.hidden {

    display:none;

}


.info {

    margin-top:20px;
    padding:10px;
    background:#083820;
    border-radius:8px;

}


</style>

</head>


<body>


<div class="container">


<h2>Market Test Logger</h2>


<label>Tester</label>

<select id="tester">

<option>Nick</option>
<option>Josh</option>

</select>



<label>Test Flow</label>

<select id="flow">

<option>Geolocation</option>
<option>KYC</option>
<option>Native App</option>
<option>Banking</option>
<option>Games</option>
<option>Responsible Gaming</option>
<option>ITS Pages</option>
<option>Registration</option>
<option>Login</option>
<option>Domain Migration</option>

</select>



<label>Scenario</label>

<input id="scenario"
placeholder="Example: Login after moving from WiFi to LTE">



<label>Result</label>

<select id="result" onchange="toggleFail()">

<option>PASS</option>
<option>FAIL</option>

</select>



<div id="failureBox" class="hidden">


<label>Failure Type</label>

<select id="failureType">

<option>Known Issue</option>
<option>New Issue</option>

</select>


</div>




<label>Device</label>

<input id="device"
placeholder="Example: iPhone 17 Pro">



<label>Operating System</label>

<input id="os"
placeholder="Example: iOS 27">



<label>Browser</label>

<input id="browser"
placeholder="Auto detected">



<label>Detailed Description</label>

<textarea id="description"
placeholder="Detailed steps, expected result, actual result"></textarea>



<div id="status" class="info">

Location detecting...

</div>


<button onclick="generateEmail()">

Generate Test Email

</button>



</div>





<script>


let locationData = {

latitude:null,
longitude:null,
accuracy:null

};



let lastJSON = "";



// Browser information

document.getElementById("browser").value =
navigator.userAgent;




// OS guess

document.getElementById("os").value =
navigator.platform;




// Network information if available

let connection =
navigator.connection ||
navigator.mozConnection ||
navigator.webkitConnection;



let networkInfo = {

type:
connection?.type || "Unknown",

effectiveType:
connection?.effectiveType || "Unknown"

};





// Location

navigator.geolocation.getCurrentPosition(

function(position){


locationData.latitude =
position.coords.latitude;


locationData.longitude =
position.coords.longitude;


locationData.accuracy =
position.coords.accuracy;



document.getElementById("status").innerHTML =

"Location captured<br>" +

"Lat: " +
locationData.latitude +

"<br>Long: " +
locationData.longitude +

"<br>Accuracy: " +
locationData.accuracy +
"m";


},


function(error){


document.getElementById("status").innerHTML =

"Location unavailable: " +
error.message;


},


{

enableHighAccuracy:true,
timeout:10000

}


);






function toggleFail(){


let result =
document.getElementById("result").value;


document.getElementById("failureBox").style.display =

result === "FAIL"
?
"block"
:
"none";


}






async function generateEmail(){



let now = new Date();



let shortRandom =
Math.floor(
Math.random()*999
)
.toString()
.padStart(3,"0");



let testId =

"AB-" +

now.toISOString()
.substring(2,16)
.replace(/[-T:]/g,"")

+

"-" +

shortRandom;





let data = {


testId:testId,


timestamp:
now.toISOString(),


tester:
document.getElementById("tester").value,


testFlow:
document.getElementById("flow").value,


scenario:
document.getElementById("scenario").value,


result:
document.getElementById("result").value,


failureType:
document.getElementById("failureType").value || null,


device:
document.getElementById("device").value,


os:
document.getElementById("os").value,


browser:
document.getElementById("browser").value,


network:networkInfo,


location:locationData,


description:
document.getElementById("description").value


};




lastJSON =
JSON.stringify(data,null,2);




let subject =

"[TEST][" +

data.result +

"][" +

data.testFlow +

"] " +

testId;





let mailURL =

"mailto:nyoung@itsmanagement.net"

+

"?subject="

+

encodeURIComponent(subject)

+

"&body="

+

encodeURIComponent(lastJSON);





window.location.href = mailURL;



}



</script>


</body>

</html>
