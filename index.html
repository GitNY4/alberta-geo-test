<!DOCTYPE html>
<html>

<head>

<title>TestTrack</title>
<p>Email to SMOP</p>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial, sans-serif;
    background:#062f1c;
    color:white;
    padding:20px;
}

.container {
    max-width:600px;
    margin:auto;
    background:#0b472c;
    padding:25px;
    border-radius:12px;
}

h2 {
    text-align:center;
    color:#7dffb3;
}

label {
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input, select, textarea, button {

    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:none;
    font-size:16px;

}

textarea {
    height:120px;
}

button {

    margin-top:25px;
    background:#19a463;
    color:white;
    font-weight:bold;

}

button:hover {
    background:#22c77a;
}

.hidden {
    display:none;
}

.info {

    margin-top:20px;
    padding:12px;
    background:#083820;
    border-radius:8px;

}

</style>

</head>


<body>


<div class="container">


<h2>Market Test Logger</h2>



<label>Tester</label>

<select id="tester">

<option>Nick</option>
<option>Josh</option>

</select>



<label>Test Flow</label>

<select id="flow">

<option>Geolocation</option>
<option>KYC</option>
<option>Native App</option>
<option>Banking</option>
<option>Games</option>
<option>Responsible Gaming</option>
<option>ITS Pages</option>
<option>Registration</option>
<option>Login</option>
<option>Domain Migration</option>

</select>



<label>Scenario</label>

<input 
id="scenario"
placeholder="Example: Login after switching WiFi to LTE">



<label>Result</label>

<select id="result" onchange="toggleFailure()">

<option>PASS</option>
<option>FAIL</option>

</select>



<div id="failureSection" class="hidden">


<label>Failure Type</label>

<select id="failureType">

<option>Known Issue</option>
<option>New Issue</option>

</select>


</div>




<label>Device</label>

<input
id="device"
placeholder="Example: iPhone 16 Plus">



<label>User Agent</label>

<textarea 
id="userAgent"
readonly>
</textarea>



<label>Network / Carrier</label>

<input
id="networkManual"
placeholder="Optional: Telus / Rogers / WiFi">



<label>Detailed Description</label>

<textarea
id="description"
placeholder="Steps, expected result, actual result"></textarea>



<div id="locationStatus" class="info">

Detecting location...

</div>



<button onclick="generateEmail()">

Generate Test Email

</button>


</div>






<script>


let locationData = {

    latitude:null,
    longitude:null,
    accuracy:null

};



let connectionData = {

    type:"Unknown",
    effectiveType:"Unknown"

};



// Populate user agent

document.getElementById("userAgent").value =
navigator.userAgent;





// Capture available network information

let connection =
navigator.connection ||
navigator.mozConnection ||
navigator.webkitConnection;


if(connection){

    connectionData.type =
    connection.type || "Unknown";

    connectionData.effectiveType =
    connection.effectiveType || "Unknown";

}






// Get GPS

if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(

function(position){


locationData.latitude =
position.coords.latitude;


locationData.longitude =
position.coords.longitude;


locationData.accuracy =
position.coords.accuracy;



document.getElementById("locationStatus").innerHTML =

"Location captured<br>" +

"Latitude: " +
locationData.latitude +

"<br>Longitude: " +
locationData.longitude +

"<br>Accuracy: " +
Math.round(locationData.accuracy)
+
"m";


},


function(error){


document.getElementById("locationStatus").innerHTML =

"Location unavailable";


},


{

enableHighAccuracy:true,
timeout:10000

}


);


}






function toggleFailure(){


let result =
document.getElementById("result").value;


document.getElementById("failureSection").style.display =

result === "FAIL"
?
"block"
:
"none";


}






function generateEmail(){



let now = new Date();



let datePart =

now.toISOString()
.substring(2,10)
.replaceAll("-","");



let timePart =

now.toTimeString()
.substring(0,5)
.replace(":","");



let randomPart =

Math.random()
.toString(36)
.substring(2,5)
.toUpperCase();



let testId =

"AB-" +

datePart +

"-" +

timePart +

"-" +

randomPart;





let result =
document.getElementById("result").value;



let data = {


testId:testId,


timestamp:
now.toISOString(),


tester:
document.getElementById("tester").value,


testFlow:
document.getElementById("flow").value,


scenario:
document.getElementById("scenario").value,


result:result,



failureType:

result === "FAIL"

?

document.getElementById("failureType").value

:

null,



device:
document.getElementById("device").value,



userAgent:
document.getElementById("userAgent").value,



network:{

browserDetected:
connectionData,

manual:
document.getElementById("networkManual").value

},



location:locationData,



description:
document.getElementById("description").value


};





let json =
JSON.stringify(data,null,2);





let subject =

"[TEST][" +

result +

"][" +

data.testFlow +

"] " +

testId;





let mailURL =

"mailto:nyoung@itsmanagement.net"

+

"?subject="

+

encodeURIComponent(subject)

+

"&body="

+

encodeURIComponent(json);





window.location.href = mailURL;



}



</script>


</body>

</html>
