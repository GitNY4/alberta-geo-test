<!DOCTYPE html>
<html>

<head>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">

<meta charset="utf-8">

<title>TestTrack</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#062f1c">


<style>

body{
font-family:Arial;
background:#062f1c;
color:#fff;
padding:20px
}

.container{
max-width:600px;
margin:auto;
background:#0b472c;
padding:25px;
border-radius:12px
}

label{
display:block;
font-weight:bold;
margin-top:15px
}

input,select,textarea,button{
width:100%;
box-sizing:border-box;
padding:12px;
margin-top:6px;
border-radius:8px;
border:none;
font-size:16px
}

textarea{
height:120px
}

button{
margin-top:15px;
background:#19a463;
color:#fff;
font-weight:bold
}

.secondary{
background:#125936
}

.hidden{
display:none
}

.info{
margin-top:20px;
padding:12px;
background:#083820;
border-radius:8px
}

.help{
margin-top:15px;
padding:12px;
background:#062b19;
border-radius:8px;
font-size:14px;
line-height:1.5
}

</style>

</head>


  
<body>


<div class="container">


<h2>TestTrack</h2>


<label>Tester</label>

<select id="tester">

<option>Nick</option>
<option>Josh</option>

</select>




<label>Test Flow</label>

<select id="flow">

<option>Geolocation</option>
<option>KYC</option>
<option>Native App</option>
<option>Banking</option>
<option>Games</option>
<option>Responsible Gaming</option>
<option>ITS Pages</option>
<option>Registration</option>
<option>Login</option>
<option>Domain Migration</option>

</select>




<label>Scenario</label>

<input id="scenario">




<label>Result</label>

<select id="result">

<option>PASS</option>
<option>FAIL</option>

</select>




<div id="failureSection" class="hidden">


<label>Failure Type</label>

<select id="failureType">

<option>Known Issue</option>
<option>New Issue</option>

</select>


</div>




<label>Device</label>

<input id="device">




<label>User Agent</label>

<textarea id="userAgent" readonly></textarea>




<label>Network / Carrier (manual)</label>

<input id="networkManual">





<label>Description</label>

<textarea id="description"></textarea>





<div id="locationStatus" class="info">

Location not checked

</div>





<div class="help">

<b>Location Accuracy Guide</b>

<br><br>

🟢 HIGH: 0-20m

<br>

Best GPS accuracy.

<br><br>


🟡 ACCEPTABLE: 21-100m

<br>

Suitable for most testing.

<br><br>


🟠 LOW: 101-500m

<br>

Reduced precision.

<br><br>


🔴 POOR: 500m+

<br>

Likely unreliable.

</div>





<button class="secondary" id="refreshLocation">

Refresh Location

</button>



<button id="generateEmail">

Generate Test Email

</button>




<button class="secondary" id="copyJSON">

Copy JSON

</button>




<button class="secondary" id="reset">

Reset Test

</button>



</div>





<script src="geo.js"></script>

<script src="app.js"></script>
<script src="media.js"></script>

</body>

</html>
