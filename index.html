<!DOCTYPE html>
<html>

<head>

<title>TestTrack</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<!-- PWA -->

<link rel="manifest" href="manifest.json">

<link rel="icon" href="icon-512.png">

<link rel="apple-touch-icon" href="icon-512.png">

<meta name="theme-color" content="#062f1c">


<style>

body {
    font-family: Arial, sans-serif;
    background:#062f1c;
    color:white;
    padding:20px;
}

.container {
    max-width:600px;
    margin:auto;
    background:#0b472c;
    padding:25px;
    border-radius:12px;
}

h2 {
    text-align:center;
    color:#7dffb3;
}

label {
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input, select, textarea, button {

    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-top:6px;
    border-radius:8px;
    border:none;
    font-size:16px;

}

textarea {
    height:120px;
}

button {

    margin-top:15px;
    background:#19a463;
    color:white;
    font-weight:bold;

}

.secondary {

    background:#125936;

}

.hidden {
    display:none;
}

.info {

    margin-top:20px;
    padding:12px;
    background:#083820;
    border-radius:8px;

}

</style>

</head>


<body>


<div class="container">


<h2>TestTrack</h2>



<label>Tester</label>

<select id="tester">

<option>Nick</option>
<option>Josh</option>

</select>



<label>Test Flow</label>

<select id="flow">

<option>Geolocation</option>
<option>KYC</option>
<option>Native App</option>
<option>Banking</option>
<option>Games</option>
<option>Responsible Gaming</option>
<option>ITS Pages</option>
<option>Registration</option>
<option>Login</option>
<option>Domain Migration</option>

</select>



<label>Scenario</label>

<input id="scenario"
placeholder="Example: Login after switching WiFi to LTE">



<label>Result</label>

<select id="result" onchange="toggleFailure()">

<option>PASS</option>
<option>FAIL</option>

</select>



<div id="failureSection" class="hidden">

<label>Failure Type</label>

<select id="failureType">

<option>Known Issue</option>
<option>New Issue</option>

</select>

</div>



<label>Device</label>

<input id="device"
placeholder="Example: iPhone 16 Plus">



<label>User Agent</label>

<textarea id="userAgent" readonly></textarea>



<label>Network / Carrier</label>

<input id="networkManual"
placeholder="Optional: Telus / Rogers / WiFi">



<label>Detailed Description</label>

<textarea id="description"
placeholder="Steps, expected result, actual result"></textarea>



<div id="locationStatus" class="info">

Location not checked

</div>



<button class="secondary" onclick="refreshLocation()">

Refresh Location

</button>



<button onclick="generateEmail()">

Generate Test Email

</button>



<button class="secondary" onclick="copyJSON()">

Copy JSON

</button>



<button class="secondary" onclick="resetForm()">

Reset Test

</button>



</div>





<script>


let locationData = {

latitude:null,
longitude:null,
accuracy:null,
capturedAt:null

};



let latestJSON = "";



let connectionData = {

type:"Unknown",
effectiveType:"Unknown"

};



// User agent

document.getElementById("userAgent").value =
navigator.userAgent;




// Network

let connection =
navigator.connection ||
navigator.mozConnection ||
navigator.webkitConnection;


if(connection){

connectionData.type =
connection.type || "Unknown";


connectionData.effectiveType =
connection.effectiveType || "Unknown";

}




function refreshLocation(){


document.getElementById("locationStatus").innerHTML =
"Refreshing GPS location...";


if(!navigator.geolocation){

document.getElementById("locationStatus").innerHTML =
"GPS unavailable";

return;

}


navigator.geolocation.getCurrentPosition(


function(position){


locationData.latitude =
position.coords.latitude;


locationData.longitude =
position.coords.longitude;


locationData.accuracy =
position.coords.accuracy;


locationData.capturedAt =
new Date().toISOString();



document.getElementById("locationStatus").innerHTML =

"Location captured ✅<br><br>" +

"Latitude: " +
locationData.latitude +

"<br>Longitude: " +
locationData.longitude +

"<br>Accuracy: " +
Math.round(locationData.accuracy)
+
"m<br><br>" +

locationData.capturedAt;


},



function(error){

document.getElementById("locationStatus").innerHTML =

"Location failed ❌<br>" +

error.message;

},


{

enableHighAccuracy:true,
timeout:15000,
maximumAge:0

}


);

}



refreshLocation();



document.addEventListener(

"visibilitychange",

function(){

if(document.visibilityState==="visible"){

refreshLocation();

}

}

);



window.addEventListener(

"pageshow",

function(){

refreshLocation();

}

);






function toggleFailure(){


let result =
document.getElementById("result").value;


document.getElementById("failureSection").style.display =

result==="FAIL"

?

"block"

:

"none";


}







function generateEmail(){


let now = new Date();


let testId =

"AB-" +

now.toISOString()
.substring(2,10)
.replaceAll("-","")

+

"-" +

now.toTimeString()
.substring(0,5)
.replace(":","")

+

"-" +

Math.random()
.toString(36)
.substring(2,5)
.toUpperCase();



let result =
document.getElementById("result").value;



let data = {


testId:testId,


timestamp:
now.toISOString(),


tester:
document.getElementById("tester").value,


testFlow:
document.getElementById("flow").value,


scenario:
document.getElementById("scenario").value,


result:result,


failureType:

result==="FAIL"

?

document.getElementById("failureType").value

:

null,


device:
document.getElementById("device").value,


userAgent:
document.getElementById("userAgent").value,


network:{

detected:connectionData,

manual:
document.getElementById("networkManual").value

},


location:locationData,


description:
document.getElementById("description").value


};



latestJSON =
JSON.stringify(data,null,2);



let subject =

"[TEST][" +

result +

"][" +

data.testFlow +

"] " +

testId;



window.location.href =

"mailto:nyoung@itsmanagement.net"

+

"?subject="

+

encodeURIComponent(subject)

+

"&body="

+

encodeURIComponent(latestJSON);



}






function copyJSON(){


if(!latestJSON){

alert("Generate Test Email first.");

return;

}



navigator.clipboard.writeText(latestJSON)

.then(()=>{

alert("JSON copied ✅");

})

.catch(()=>{

alert("Copy failed");

});


}







function resetForm(){


document.getElementById("scenario").value="";

document.getElementById("description").value="";

document.getElementById("networkManual").value="";

document.getElementById("result").value="PASS";


latestJSON="";


toggleFailure();


refreshLocation();


}





// Register service worker

if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}



</script>


</body>

</html>
