<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b472c"/>
      <stop offset="1" stop-color="#062f1c"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c37c"/>
      <stop offset="1" stop-color="#19a463"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- subtle ring for depth -->
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#125936" stroke-width="4"/>

  <!-- location pin -->
  <path d="M256 96
           c-70 0-124 54-124 124
           c0 92 124 208 124 208
           s124-116 124-208
           c0-70-54-124-124-124z"
        fill="url(#pin)"/>

  <!-- inner white circle for checkmark contrast -->
  <circle cx="256" cy="222" r="66" fill="#062f1c"/>
  <circle cx="256" cy="222" r="54" fill="#fdfdfd"/>

  <!-- checkmark -->
  <path d="M228 224 l20 20 l38 -46"
        fill="none" stroke="#19a463" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
